<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3eee4">
  <title>待办清单</title>
  <link rel="icon" type="image/png" href="assets/icon-cat.png">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('desk-todo.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      } catch (_) { /* 使用默认浅色主题 */ }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.3 4.2L19 7.4"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8.5" y="8.5" width="12" height="12" rx="2.2"/>
      <path d="M15.5 8.5V6.2A2.2 2.2 0 0 0 13.3 4H6.2A2.2 2.2 0 0 0 4 6.2v7.1a2.2 2.2 0 0 0 2.2 2.2h2.3"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.5" y="5.5" width="17" height="15" rx="2.4"/>
      <path d="M8 3.5v4M16 3.5v4M3.5 10.5h17"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4.8h6V7M6.5 7l.8 12.2a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8L17.5 7M10 11v6M14 11v6"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.5v13M5.5 12h13"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20.2 14.2A8.6 8.6 0 0 1 9.8 3.8 8.6 8.6 0 1 0 20.2 14.2z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24">
      <path d="M14.5 5.5L8 12l6.5 6.5"/>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24">
      <path d="M9.5 5.5L16 12l-6.5 6.5"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7.5v5.2M12 16.4v.1"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <header class="header">
      <div class="topbar">
        <div class="dateline">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="todayText">今天</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题" title="切换主题">
            <svg class="icon icon-moon"><use href="#i-moon"></use></svg>
            <svg class="icon icon-sun"><use href="#i-sun"></use></svg>
          </button>
          <button class="copy-btn" id="copyBtn" type="button" disabled title="进入多选复制模式">
            <svg class="icon"><use href="#i-copy"></use></svg>
            <span id="copyLabel">复制</span>
          </button>
        </div>
      </div>

      <div class="title-row">
        <h1>待办清单</h1>
        <span class="progress-count" id="progressText">0 / 0</span>
      </div>
      <p class="summary" id="summaryText">从一件小事开始。</p>
      <div class="progress-track" id="progressTrack" role="progressbar" aria-label="完成进度"
           aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </header>

    <div class="selection-bar" id="selectionBar" hidden>
      <span class="selection-count"><b id="selectedCount">0</b> 项已选</span>
      <span class="selection-tip" id="selectionTip">再点「复制」完成</span>
      <div class="selection-actions">
        <button type="button" id="selectAllBtn">全选</button>
        <button type="button" id="cancelSelectBtn">取消</button>
      </div>
    </div>

    <main class="list-wrap">
      <div class="task-list" id="taskList" role="list" aria-label="任务列表"></div>

      <section class="empty-state" id="emptyState" aria-label="空清单">
        <div class="empty-art" aria-hidden="true">
          <span class="orbit orbit-a"></span>
          <span class="orbit orbit-b"></span>
          <span class="spark spark-a"></span>
          <span class="spark spark-b"></span>
          <span class="empty-check">
            <svg class="icon"><use href="#i-check"></use></svg>
          </span>
        </div>
        <h2>今天还很轻</h2>
        <p>写下第一件想做的事，<br>让今天有一个清晰的开始。</p>
        <button type="button" class="empty-cta" id="emptyAddBtn">添加第一项</button>
      </section>
    </main>

    <footer class="composer" id="composer">
      <input id="newTaskInput" type="text" maxlength="500" placeholder="添加一项任务…"
             autocomplete="off" spellcheck="false" aria-label="新任务内容">
      <button type="button" class="composer-date" id="composerDateBtn" aria-label="设置新任务日期" title="设置日期">
        <svg class="icon"><use href="#i-calendar"></use></svg>
        <span id="composerDateLabel">日期</span>
      </button>
      <button type="button" class="add-btn" id="addBtn" aria-label="添加任务" disabled>
        <svg class="icon"><use href="#i-plus"></use></svg>
      </button>
    </footer>
  </div>

  <div class="calendar" id="calendar" role="dialog" aria-label="选择日期" hidden>
    <div class="calendar-head">
      <button type="button" class="cal-nav" id="calPrev" aria-label="上个月">
        <svg class="icon"><use href="#i-chevron-left"></use></svg>
      </button>
      <div class="cal-title" id="calTitle"></div>
      <button type="button" class="cal-nav" id="calNext" aria-label="下个月">
        <svg class="icon"><use href="#i-chevron-right"></use></svg>
      </button>
    </div>
    <div class="cal-weekdays" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid" id="calGrid" role="group" aria-label="日期"></div>
    <div class="calendar-foot">
      <button type="button" id="calToday">今天</button>
      <button type="button" id="calClear">清除日期</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-icon">
      <svg class="icon" id="toastIcon"><use href="#i-check"></use></svg>
    </span>
    <span class="toast-text" id="toastText"></span>
    <button type="button" class="toast-action" id="toastAction" hidden></button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
